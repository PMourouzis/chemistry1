<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ΧΗΜΕΙΑ Β' ΓΥΜΝΑΣΙΟΥ</title>
<style>
:root{--back:#ffff00;--bar:#008080;--ok:#008000;--err:#ff0000;--ink:#000;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--back);font-family:Arial,Helvetica,sans-serif;font-size:14px;color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:16px}
#app{width:100%;max-width:860px;background:var(--card);border:2px solid var(--bar);box-shadow:0 4px 14px rgba(0,0,0,.3);display:flex;flex-direction:column}
header{background:var(--bar);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}
header button{background:#fff;color:var(--bar);border:0;padding:5px 9px;font-weight:bold;cursor:pointer;border-radius:3px}
.bar2{display:flex;justify-content:space-between;padding:8px 14px;background:#e6f2f2;border-bottom:1px solid var(--bar);font-weight:bold}
main{display:flex;min-height:380px}
#list{width:170px;border-right:1px solid #ccc;padding:8px;overflow:auto;display:none}
#list.on{display:block}
#list button{display:block;width:100%;margin:0 0 5px;padding:6px;text-align:left;border:1px solid #999;background:#f4f4f4;cursor:pointer}
#list button.cur{border-color:var(--bar);background:#cfe9e9;font-weight:bold}
#list button.done::after{content:" ✓";color:var(--ok)}
#stage{flex:1;padding:16px}
.q{font-weight:bold;font-size:15px;margin-bottom:12px;line-height:1.4}
.qimg{display:block;margin:0 0 12px;max-width:100%;height:auto;border:1px solid #bbb}
label.opt{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;margin:4px 0;border:1px solid #ccc;border-radius:4px;cursor:pointer}
label.opt:hover{background:#f0fafa}
label.opt.good{background:#d9f2d9;border-color:var(--ok)}
label.opt.bad{background:#ffdcdc;border-color:var(--err)}
.match{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap}
.match b{min-width:90px}
.match select{flex:1;min-width:220px;padding:6px;font-size:14px}
nav.foot{display:flex;justify-content:space-between;gap:8px;padding:10px 14px;border-top:1px solid #ccc;background:#f4f4f4}
.btn{background:var(--bar);color:#fff;border:0;padding:8px 16px;font-size:14px;cursor:pointer;border-radius:3px}
.btn:disabled{opacity:.4;cursor:default}
.btn.alt{background:#666}
.center{text-align:center;padding:30px 10px}
.center h2{margin-top:0}
.score{font-size:28px;font-weight:bold;margin:14px 0}
.pass{color:var(--ok)}.fail{color:var(--err)}
.rev{border:1px solid #ccc;border-radius:4px;padding:12px;margin:0 0 14px}
.rev.ok{border-left:6px solid var(--ok)}.rev.no{border-left:6px solid var(--err)}
.fb{font-weight:bold;margin-top:8px}
.note{font-size:12px;color:#555;margin-top:6px}
.mt{display:flex;gap:18px;flex-wrap:wrap}
.mcol{flex:1;min-width:280px}
.mrow{display:flex;align-items:center;gap:8px;margin:8px 0}
.mrow b{width:90px;flex:none;background:var(--bar);color:#fff;padding:10px 6px;text-align:center;border-radius:3px}
.dz{flex:1;min-height:46px;border:2px dashed #888;border-radius:4px;background:#fafafa;padding:3px;display:flex;align-items:stretch}
.dz.over,.pool.over{background:#e0f5f5;border-color:var(--bar)}
.pool{flex:1;min-width:260px;min-height:120px;border:1px solid #bbb;border-radius:4px;background:#f1f1f1;padding:6px}
.chip{background:#fff;border:1px solid var(--bar);border-radius:4px;padding:8px 10px;margin:4px 0;cursor:grab;user-select:none;flex:1;display:flex;align-items:center}
.pool .chip{display:block}
.chip.sel{background:#fff3a0;outline:2px solid var(--bar)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9}
#modal div{background:#fff;border:2px solid var(--bar);padding:18px;max-width:420px;border-radius:6px}
#modal p{margin:0 0 14px;font-weight:bold}
#modal .row{display:flex;gap:8px;justify-content:flex-end}
@media(max-width:600px){main{flex-direction:column}#list{width:100%;border-right:0;border-bottom:1px solid #ccc}}
@media print{body{background:#fff}header button,nav.foot{display:none}}
</style>
</head>
<body>
<div id="app">
  <header><h1 id="title"></h1><button id="btnList" title="Λίστα ερωτήσεων">☰ Ερωτήσεις</button><button id="btnPrint" title="Εκτύπωση">🖨</button></header>
  <div class="bar2" id="bar2" hidden><span id="qno"></span><span id="pts"></span></div>
  <main><div id="list"></div><div id="stage"></div></main>
  <nav class="foot" id="foot"></nav>
</div>

const $ = s => document.querySelector(s);
const T = { 1:'tf', 2:'single', 3:'multi', 5:'match' };
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let order = [], ans = [], cur = 0, mode = 'start', sel = null, sub = [];
function ask(msg, yes){
  const m = document.createElement('div'); m.id = 'modal';
  m.innerHTML = `<div><p>${esc(msg)}</p><div class="row"><button class="btn alt" id="mNo">Όχι</button><button class="btn" id="mYes">Ναι</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#mNo').onclick = () => m.remove();
  m.querySelector('#mYes').onclick = () => { m.remove(); yes(); };
}

$('#title').textContent = QUIZ.title;
$('#btnPrint').onclick = () => window.print();
$('#btnList').onclick = () => { if (mode === 'quiz') $('#list').classList.toggle('on'); };

function start(){
  order = shuffle(QUIZ.items.map((_, i) => i));
  ans = order.map(() => null); sub = order.map(() => false);
  cur = 0; mode = 'quiz';
  // για κάθε ερώτηση ταιριάσματος, ανακατεύουμε τις δεξιές επιλογές
  QUIZ.items.forEach(q => { if (T[q.t] === 'match') q._opts = shuffle(q.a.map((x, i) => i)); });
  $('#bar2').hidden = false;
  render();
}

function showStart(){
  mode = 'start'; $('#bar2').hidden = true; $('#list').classList.remove('on');
  $('#stage').innerHTML = `<div class="center"><h2>${esc(QUIZ.title)}</h2><p>${esc(QUIZ.info)}</p>
    <p class="note">${QUIZ.items.length} ερωτήσεις · Βάση επιτυχίας: ${QUIZ.pass}%</p></div>`;
  $('#foot').innerHTML = `<span></span><button class="btn" id="go">Έναρξη…</button>`;
  $('#go').onclick = start;
}

function renderList(){
  $('#list').innerHTML = order.map((_, k) => `<button data-k="${k}" class="${k===cur?'cur':''} ${sub[k]?'done':''}">Ερώτηση ${k+1}</button>`).join('');
  $('#list').querySelectorAll('button').forEach(b => b.onclick = () => { collect(); cur = +b.dataset.k; render(); });
}

function isAnswered(k){
  const a = ans[k], q = QUIZ.items[order[k]];
  if (a == null) return false;
  if (T[q.t] === 'multi') return a.length > 0;
  if (T[q.t] === 'match') return Object.keys(a).length > 0;
  return true;
}

function render(){
  const q = QUIZ.items[order[cur]], kind = T[q.t], a = ans[cur];
  $('#qno').textContent = `Ερώτηση ${cur+1} / ${order.length}`;
  $('#pts').textContent = `${q.p} βαθμ.`;
  let h = '';
  if (sub[cur]) {
    const good = isCorrect(q, a);
    h = (q.img ? `<img class="qimg" alt="" width="${q.img[1]}" height="${q.img[2]}" src="${QUIZ.imgs[q.img[0]] || ''}">` : '') +
        `<div class="q">${esc(q.q)}</div>${answerHTML(q, a)}<div class="fb ${good?'pass':'fail'}">${good ? 'Σωστό' : 'Λάθος'}</div>` +
        (good ? '' : '<div class="note">Με πράσινο φαίνεται η σωστή απάντηση.</div>');
  } else {
  if (q.img) h += `<img class="qimg" alt="" width="${q.img[1]}" height="${q.img[2]}" src="${QUIZ.imgs[q.img[0]] || ''}">`;
  h += `<div class="q">${esc(q.q)}</div>`;
  if (kind === 'single' || kind === 'tf') {
    const opts = kind === 'tf' ? ['Σωστό','Λάθος'] : q.a.map(x => x.x);
    h += opts.map((t, i) => `<label class="opt"><input type="radio" name="r" value="${i}" ${a===i?'checked':''}> <span>${esc(t)}</span></label>`).join('');
  } else if (kind === 'multi') {
    h += `<div class="note">Επιλέξτε όλες τις σωστές απαντήσεις.</div>`;
    h += q.a.map((x, i) => `<label class="opt"><input type="checkbox" value="${i}" ${a && a.includes(i)?'checked':''}> <span>${esc(x.x)}</span></label>`).join('');
  } else if (kind === 'match') {
    const left = q.a.map((x, i) => [x, i]).filter(([x]) => x.k && x.k.trim() !== '.');
    if (ans[cur] == null) ans[cur] = {};
    h += `<div class="note">Σύρετε κάθε απάντηση στη σωστή θέση (ή πατήστε μια απάντηση και μετά τη θέση).</div>
      <div class="mt"><div class="mcol">${left.map(([x, i]) => `<div class="mrow"><b>${esc(x.k)}</b><div class="dz" data-slot="${i}"></div></div>`).join('')}</div><div class="pool" id="pool"></div></div>`;
  }
  }
  $('#stage').innerHTML = h;
  if (kind === 'match' && !sub[cur]) drawMatch(q);
  $('#foot').innerHTML = `<button class="btn alt" id="prev" ${cur===0?'disabled':''}>◀ Προηγούμενη</button>
    <button class="btn" id="submitQ" ${sub[cur]||!isAnswered(cur)?'disabled':''}>Καταχώρηση</button>
    <button class="btn" id="finish">Ολοκλήρωση</button>
    <button class="btn alt" id="next" ${cur===order.length-1?'disabled':''}>Επόμενη ▶</button>`;
  $('#prev').onclick = () => { collect(); cur--; render(); };
  $('#next').onclick = () => { collect(); cur++; render(); };
  $('#submitQ').onclick = () => { collect(); if (!isAnswered(cur)) return; sub[cur] = true; render(); };
  $('#finish').onclick = finish;
  $('#stage').querySelectorAll('input,select').forEach(e => e.onchange = () => { collect(); renderList(); const b = $('#submitQ'); if (b) b.disabled = !isAnswered(cur); });
  renderList();
}

function drawMatch(q){
  const a = ans[cur], used = Object.values(a), st = $('#stage');
  sel = null;
  const chip = j => `<div class="chip" draggable="true" data-j="${j}">${esc(q.a[j].x)}</div>`;
  st.querySelectorAll('.dz').forEach(z => { const j = a[z.dataset.slot]; z.innerHTML = j != null ? chip(j) : ''; });
  $('#pool').innerHTML = q._opts.filter(j => !used.includes(j)).map(chip).join('');
  const place = (slot, j) => {
    for (const k in a) if (a[k] === j) delete a[k];
    if (slot === null) { drawMatch(q); renderList(); const b = $('#submitQ'); if (b) b.disabled = !isAnswered(cur); return; }
    a[slot] = j; drawMatch(q); renderList(); const b = $('#submitQ'); if (b) b.disabled = !isAnswered(cur);
  };
  st.querySelectorAll('.chip').forEach(c => {
    c.ondragstart = e => { e.dataTransfer.setData('text/plain', c.dataset.j); e.dataTransfer.effectAllowed = 'move'; };
    c.onclick = e => { e.stopPropagation(); const j = +c.dataset.j; sel = sel === j ? null : j; st.querySelectorAll('.chip').forEach(x => x.classList.toggle('sel', +x.dataset.j === sel)); };
  });
  st.querySelectorAll('.dz,#pool').forEach(z => {
    z.ondragover = e => { e.preventDefault(); z.classList.add('over'); };
    z.ondragleave = () => z.classList.remove('over');
    z.ondrop = e => { e.preventDefault(); const j = +e.dataTransfer.getData('text/plain'); place(z.id === 'pool' ? null : z.dataset.slot, j); };
    z.onclick = () => { if (sel != null) place(z.id === 'pool' ? null : z.dataset.slot, sel); };
  });
}

function collect(){
  if (mode !== 'quiz' || sub[cur]) return;
  const q = QUIZ.items[order[cur]], kind = T[q.t], st = $('#stage');
  if (kind === 'single' || kind === 'tf') { const r = st.querySelector('input:checked'); ans[cur] = r ? +r.value : null; }
  else if (kind === 'multi') ans[cur] = [...st.querySelectorAll('input:checked')].map(e => +e.value);
}

function isCorrect(q, a){
  const kind = T[q.t];
  if (a == null) return false;
  if (kind === 'tf') return a === q.a.findIndex(x => x.c);
  if (kind === 'single') return a === q.a.findIndex(x => x.c);
  if (kind === 'multi') { const right = q.a.map((x,i)=>x.c?i:-1).filter(i=>i>=0); return a.length === right.length && right.every(i => a.includes(i)); }
  if (kind === 'match') { const left = q.a.map((x,i)=>[x,i]).filter(([x]) => x.k && x.k.trim() !== '.'); return left.every(([, i]) => a[i] === i); }
  return false;
}

function finish(){
  collect();
  const un = order.some((_, k) => !isAnswered(k));
  ask(un ? 'Υπάρχουν ερωτήσεις που δεν έχουν απαντηθεί. Θέλετε να υποβάλετε τις απαντήσεις σας και να δείτε τα αποτελέσματα;'
         : 'Θέλετε να υποβάλετε τις απαντήσεις σας και να δείτε τα αποτελέσματα;', results);
}

function results(){
  mode = 'result'; $('#list').classList.remove('on'); $('#bar2').hidden = true;
  let score = 0, total = 0;
  order.forEach((qi, k) => { const q = QUIZ.items[qi]; total += q.p; if (isCorrect(q, ans[k])) score += q.p; });
  const pct = total ? score / total * 100 : 0, ok = pct >= QUIZ.pass;
  $('#stage').innerHTML = `<div class="center"><h2>Αποτελέσματα</h2>
    <div class="score ${ok?'pass':'fail'}">${score} από ${total} (${Math.round(pct)}%)</div>
    <p>Βάση επιτυχίας: ${QUIZ.pass}%</p>
    <p class="${ok?'pass':'fail'}"><b>${ok ? 'Συγχαρητήρια, περάσατε.' : 'Δεν περάσατε.'}</b></p>
    <p>Ευχαριστούμε που συμμετείχατε στο τεστ.</p></div>`;
  $('#foot').innerHTML = `<button class="btn alt" id="rv">Ανασκόπηση</button><button class="btn" id="again">Δοκιμάστε ξανά</button>`;
  $('#rv').onclick = review;
  $('#again').onclick = () => ask('Θέλετε να ξαναπαρακολουθήσετε το τεστ;', showStart);
}

function answerHTML(q, a){
  const kind = T[q.t];
  let body = '';
  if (kind === 'tf') {
    body = ['Σωστό','Λάθος'].map((t,i) => `<label class="opt ${q.a[i].c?'good':(a===i?'bad':'')}"><input type="radio" disabled ${a===i?'checked':''}> ${t}</label>`).join('');
  } else if (kind === 'single') {
    body = q.a.map((x,i) => `<label class="opt ${x.c?'good':(a===i?'bad':'')}"><input type="radio" disabled ${a===i?'checked':''}> ${esc(x.x)}</label>`).join('');
  } else if (kind === 'multi') {
    body = q.a.map((x,i) => { const sel = a && a.includes(i); return `<label class="opt ${x.c?'good':(sel?'bad':'')}"><input type="checkbox" disabled ${sel?'checked':''}> ${esc(x.x)}</label>`; }).join('');
  } else {
    body = q.a.map((x,i) => ({x,i})).filter(({x}) => x.k && x.k.trim() !== '.').map(({x,i}) => {
      const mine = a && a[i] != null ? q.a[a[i]].x : '—';
      return `<div class="match"><b>${esc(x.k)}</b> → <span class="${a && a[i]===i?'pass':'fail'}">${esc(mine)}</span>${a && a[i]===i ? '' : ` <span class="note">(σωστό: ${esc(x.x)})</span>`}</div>`;
    }).join('');
  }
  return body;
}

function review(){
  const kinds = [];
  $('#stage').innerHTML = order.map((qi, k) => {
    const q = QUIZ.items[qi], kind = T[q.t], a = ans[k], good = isCorrect(q, a);
    const body = answerHTML(q, a);
    return `<div class="rev ${good?'ok':'no'}">
      ${q.img ? `<img class="qimg" alt="" width="${q.img[1]}" height="${q.img[2]}" src="${QUIZ.imgs[q.img[0]]||''}">` : ''}
      <div class="q">${k+1}. ${esc(q.q)}</div>${body}
      <div class="fb ${good?'pass':'fail'}">${good ? 'Σωστό' : 'Λάθος'}</div></div>`;
  }).join('');
  $('#foot').innerHTML = `<button class="btn alt" id="bk">◀ Αποτελέσματα</button><button class="btn" id="again">Δοκιμάστε ξανά</button>`;
  $('#bk').onclick = results;
  $('#again').onclick = () => ask('Θέλετε να ξαναπαρακολουθήσετε το τεστ;', showStart);
}

showStart();
</script>
</body>
</html>
